name: Build HyabridCam iOS (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['App/**', 'bridge/**', 'core/**', 'scripts/**', 'project.yml', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install xcodegen
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
            sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain 1.85.0
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build device IPA and simulator
        run: |
          export RUSTUP_TOOLCHAIN=1.85.0
          bash scripts/build-ios.sh device
          bash scripts/build-ios.sh simulator
      - uses: actions/upload-artifact@v4
        with:
          name: HyabridCam-unsigned
          path: |
            build/HyabridCam-unsigned.ipa
            build/HyabridCam-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
