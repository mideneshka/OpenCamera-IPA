name: HyabridCam
options:
  bundleIdPrefix: app.hyabridcam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  HyabridCam:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: bridge/hyabrid_core.h
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.hyabridcam.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: HyabridCam
        INFOPLIST_KEY_NSCameraUsageDescription: Фото и видео в HyabridCam
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Звук при записи видео
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Сохранение снимков, RAW и видео
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: bridge/hyabrid_core.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lhyabrid_core"
schemes:
  HyabridCam:
    build:
      targets:
        HyabridCam: all
    run:
      config: Debug
    archive:
      config: Release
